name: Sherlocked
options:
  bundleIdPrefix: com.sherlocked
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.2"
  generateEmptyDirectories: true

packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.1.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    META_APP_ID: "0"
    CLIENT_TOKEN: "0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SHERLOCKED_BACKEND_URL: "http://127.0.0.1:8787"

targets:
  Sherlocked:
    type: application
    platform: iOS
    sources:
      - path: Sherlocked
        excludes:
          - Info.plist
          - "*.entitlements"
    entitlements:
      path: Sherlocked/Sherlocked.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tanmaysahu.sherlocked
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sherlocked/Info.plist
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: MetaWearablesDAT
        product: MWDATSpeech
      - package: MetaWearablesDAT
        product: MWDATMockDevice

  SherlockedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SherlockedTests
    dependencies:
      - target: Sherlocked
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATMockDevice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tanmaysahu.sherlocked.tests
        GENERATE_INFOPLIST_FILE: YES

  SherlockedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SherlockedUITests
    dependencies:
      - target: Sherlocked
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tanmaysahu.sherlocked.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Sherlocked

schemes:
  Sherlocked:
    build:
      targets:
        Sherlocked: all
        SherlockedTests: [test]
        SherlockedUITests: [test]
    test:
      targets:
        - SherlockedTests
        - SherlockedUITests
